<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>2 Roti – Animated Logo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:100vw;height:100vh;
    background:#0E0E0E;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }

  /* ── dark radial glow behind logo ── */
  body::before{
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 60% 60% at 50% 45%,
      rgba(255,87,34,.18) 0%,transparent 70%);
    animation:glowPulse 4s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes glowPulse{from{opacity:.6}to{opacity:1}}

  /* ── squircle wrapper ── */
  .logo-squircle{
    width:220px;height:220px;
    background:linear-gradient(145deg,#ffffff 0%,#f0f0f0 100%);
    border-radius:52px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    box-shadow:
      0 24px 70px rgba(255,87,34,.55),
      0 8px 24px rgba(0,0,0,.5),
      0 0 0 1px rgba(255,140,0,.2);
    animation:squircleFloat 3.5s ease-in-out infinite;
  }
  @keyframes squircleFloat{
    0%,100%{transform:translateY(0)   scale(1)}
    50%    {transform:translateY(-16px) scale(1.02)}
  }

  /* ── the animated logo SVG ── */
  .logo-svg{width:160px;height:160px;overflow:visible}

  /* LOCATION PIN — bounce drop on load */
  .pin-group{
    animation:pinDrop .8s cubic-bezier(.34,1.56,.64,1) .2s both;
    transform-origin:80px 140px;
  }
  @keyframes pinDrop{
    from{transform:translateY(-60px) scale(.5);opacity:0}
    to  {transform:translateY(0)     scale(1); opacity:1}
  }

  /* PIN BODY — subtle breathing pulse */
  .pin-body{
    animation:pinBreath 2.8s ease-in-out 1s infinite;
    transform-origin:80px 80px;
  }
  @keyframes pinBreath{
    0%,100%{transform:scale(1)}
    50%    {transform:scale(1.04)}
  }

  /* ROTI — continuous spin inside pin hole */
  .roti-group{
    transform-origin:80px 78px;
    animation:rotiSpin 3s linear 1s infinite;
  }
  @keyframes rotiSpin{
    from{transform:rotate(0deg)}
    to  {transform:rotate(360deg)}
  }

  /* ROTI PUFF — scale up/down as it spins */
  .roti-disc{
    transform-origin:80px 78px;
    animation:rotiPuff 1.5s ease-in-out 1s infinite alternate;
  }
  @keyframes rotiPuff{
    from{transform:scale(.92)}
    to  {transform:scale(1.08)}
  }

  /* SWOOSH LINES — dash animation left to right */
  .swoosh-line{
    stroke-dasharray:60;
    stroke-dashoffset:60;
    animation:swooshDraw 1.8s ease-in-out 1.2s infinite;
  }
  .swoosh-line-2{
    stroke-dasharray:30;
    stroke-dashoffset:30;
    animation:swooshDraw 1.8s ease-in-out 1.5s infinite;
  }
  .swoosh-line-3{
    stroke-dasharray:18;
    stroke-dashoffset:18;
    animation:swooshDraw 1.8s ease-in-out 1.7s infinite;
  }
  @keyframes swooshDraw{
    0%  {stroke-dashoffset:60;opacity:1}
    60% {stroke-dashoffset:0; opacity:1}
    100%{stroke-dashoffset:-60;opacity:0}
  }

  /* PIN TIP — ping dot */
  .pin-tip-dot{
    transform-origin:80px 148px;
    animation:tipPing 2s ease-out 1.5s infinite;
  }
  @keyframes tipPing{
    0%  {transform:scale(1);opacity:1}
    100%{transform:scale(3);opacity:0}
  }

  /* ── pulse ring around squircle ── */
  .pulse-ring{
    position:absolute;inset:-4px;
    border-radius:56px;
    border:2px solid rgba(255,87,34,.65);
    animation:ringPulse 2.2s ease-out 1s infinite;
  }
  .pulse-ring:nth-child(2){animation-delay:1.6s;border-color:rgba(255,140,0,.35)}
  @keyframes ringPulse{
    0%  {transform:scale(1);opacity:1}
    100%{transform:scale(1.25);opacity:0}
  }

  /* ── progress bar ── */
  .progress-wrap{
    margin-top:44px;width:200px;
    animation:fadeUp .6s ease .8s both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .lbl{
    text-align:center;font-size:12px;letter-spacing:.1em;
    color:rgba(255,255,255,.38);margin-bottom:10px;
    text-transform:uppercase;transition:opacity .3s;
  }
  .track{height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
  .fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#FF5722,#FF9800,#FF5722);
    background-size:200%;
    animation:fillBar 3.5s cubic-bezier(.4,0,.2,1) 1.2s forwards,
               shimmer 1.3s linear 1.2s infinite;
  }
  @keyframes fillBar{0%{width:0%}35%{width:45%}70%{width:80%}100%{width:100%}}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,87,34,.7);animation:dotB 1.1s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.18s}
  .dot:nth-child(3){animation-delay:.36s}
  @keyframes dotB{0%,80%,100%{transform:scale(1);opacity:.4}40%{transform:scale(1.9);opacity:1}}
</style>
</head>
<body>

<div class="logo-squircle">
  <!-- Pulse rings around squircle -->
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>

  <!-- ANIMATED LOGO SVG — exact recreation of app_icon_light.jpg -->
  <svg class="logo-svg" viewBox="0 0 160 170" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Orange pin gradient -->
      <radialGradient id="pinGrad" cx="38%" cy="28%" r="65%">
        <stop offset="0%"   stop-color="#FF7043"/>
        <stop offset="60%"  stop-color="#F4511E"/>
        <stop offset="100%" stop-color="#BF360C"/>
      </radialGradient>
      <!-- Pin dark inner shadow ring -->
      <radialGradient id="pinInner" cx="50%" cy="50%" r="50%">
        <stop offset="60%"  stop-color="#C62800"/>
        <stop offset="100%" stop-color="#8B1500"/>
      </radialGradient>
      <!-- Roti warm golden gradient -->
      <radialGradient id="rotiGrad" cx="38%" cy="32%" r="62%">
        <stop offset="0%"   stop-color="#FFF3C4"/>
        <stop offset="25%"  stop-color="#FFE082"/>
        <stop offset="55%"  stop-color="#FFCA28"/>
        <stop offset="80%"  stop-color="#F5A623"/>
        <stop offset="100%" stop-color="#D4780A"/>
      </radialGradient>
      <!-- Roti center char -->
      <radialGradient id="charGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#B8660A" stop-opacity=".65"/>
        <stop offset="100%" stop-color="transparent"/>
      </radialGradient>
      <!-- Swoosh gradient -->
      <linearGradient id="swooshG" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#FF5722" stop-opacity="0"/>
        <stop offset="40%"  stop-color="#FF7043"/>
        <stop offset="100%" stop-color="#FF9800"/>
      </linearGradient>
      <!-- Clip roti inside pin hole -->
      <clipPath id="pinHole">
        <circle cx="80" cy="78" r="36"/>
      </clipPath>
      <!-- Blur filter for char spots -->
      <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs>

    <!-- ══════════════════════════════
         ENTIRE PIN GROUP
    ══════════════════════════════ -->
    <g class="pin-group">

      <!-- PIN BODY (teardrop shape) -->
      <g class="pin-body">
        <path d="M80 8
                 C48 8 22 34 22 66
                 C22 100 80 152 80 152
                 C80 152 138 100 138 66
                 C138 34 112 8 80 8 Z"
              fill="url(#pinGrad)"/>

        <!-- Pin shadow / depth inner -->
        <path d="M80 8
                 C48 8 22 34 22 66
                 C22 100 80 152 80 152
                 C80 152 138 100 138 66
                 C138 34 112 8 80 8 Z"
              fill="none"
              stroke="rgba(100,20,0,.25)"
              stroke-width="3"/>

        <!-- Pin highlight (top-left sheen) -->
        <path d="M44 28 Q52 16 68 14 Q80 12 88 16"
              stroke="rgba(255,255,255,.28)"
              stroke-width="5"
              stroke-linecap="round"
              fill="none"/>

        <!-- Dark inner ring (the hole in pin) -->
        <circle cx="80" cy="78" r="40" fill="url(#pinInner)" opacity=".6"/>
        <!-- White inner ring -->
        <circle cx="80" cy="78" r="36" fill="rgba(255,255,255,.1)"/>
      </g>

      <!-- ══════════════════════
           ROTI — spinning inside pin hole
      ══════════════════════ -->
      <g class="roti-group" clip-path="url(#pinHole)">
        <g class="roti-disc">
          <!-- Main roti body -->
          <circle cx="80" cy="78" r="34" fill="url(#rotiGrad)"/>
          <!-- Center char zone -->
          <circle cx="80" cy="78" r="18" fill="url(#charGrad)"/>
          <!-- Char / toast spots -->
          <ellipse cx="66" cy="64" rx="8" ry="5"   fill="#C07010" opacity=".4"  transform="rotate(-25,66,64)"   filter="url(#blur1)"/>
          <ellipse cx="96" cy="68" rx="7" ry="4.5" fill="#A86008" opacity=".35" transform="rotate(15,96,68)"    filter="url(#blur1)"/>
          <ellipse cx="68" cy="94" rx="8" ry="5"   fill="#C07010" opacity=".38" transform="rotate(8,68,94)"     filter="url(#blur1)"/>
          <ellipse cx="94" cy="92" rx="6" ry="4"   fill="#986006" opacity=".3"  transform="rotate(-12,94,92)"   filter="url(#blur1)"/>
          <ellipse cx="84" cy="58" rx="5" ry="3"   fill="#B87010" opacity=".28"                                 filter="url(#blur1)"/>
          <!-- Outer rim -->
          <circle cx="80" cy="78" r="34" fill="none" stroke="rgba(210,140,10,.5)" stroke-width="2"/>
          <!-- Inner ring texture -->
          <circle cx="80" cy="78" r="26" fill="none" stroke="rgba(255,220,80,.2)" stroke-width="3"/>
          <!-- Puff highlight -->
          <ellipse cx="68" cy="64" rx="16" ry="10" fill="rgba(255,240,180,.2)" transform="rotate(-30,68,64)"/>
        </g>
      </g>

      <!-- Pin hole border (drawn ON TOP of roti) -->
      <circle cx="80" cy="78" r="36" fill="none" stroke="#E64A19" stroke-width="3.5"/>

      <!-- ══════════════════════
           SWOOSH LINES (moving left to right)
      ══════════════════════ -->
      <!-- Main swoosh arc -->
      <path class="swoosh-line"
            d="M 20 108 Q 38 126 60 122 Q 80 118 104 122 Q 128 126 145 112"
            stroke="url(#swooshG)" stroke-width="5.5"
            stroke-linecap="round" fill="none"/>
      <!-- Second thinner swoosh -->
      <path class="swoosh-line-2"
            d="M 12 116 Q 28 128 46 126"
            stroke="#FF7043" stroke-width="3"
            stroke-linecap="round" fill="none" opacity=".7"/>
      <!-- Third shortest swoosh -->
      <path class="swoosh-line-3"
            d="M 4 122 Q 16 130 28 128"
            stroke="#FF9800" stroke-width="2"
            stroke-linecap="round" fill="none" opacity=".5"/>

      <!-- ══════════════════════
           PIN TIP PING DOT
      ══════════════════════ -->
      <circle class="pin-tip-dot"
              cx="80" cy="148" r="4"
              fill="rgba(255,87,34,.7)"/>

    </g><!-- /pin-group -->

  </svg>
</div>

<!-- Progress bar -->
<div class="progress-wrap">
  <div class="lbl" id="lbl">Fresh roti on the way</div>
  <div class="track"><div class="fill"></div></div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
  const s=[[0,'Fresh roti on the way'],[1400,'Piping hot &#128293;'],[2400,'Rider on the way &#128757;'],[3400,'Delivered! &#127881;']];
  const e=document.getElementById('lbl');
  s.forEach(([t,h])=>setTimeout(()=>{e.style.opacity='0';setTimeout(()=>{e.innerHTML=h;e.style.opacity='1'},300)},t));
</script>
</body>
</html>
